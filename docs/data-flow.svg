<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Helvetica, Arial, sans-serif">
  <title>Smart Room Monitor data flow</title>
  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5fa8"/>
    </marker>
    <marker id="aOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c4581b"/>
    </marker>
    <marker id="aGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
    <style>
      .zone { stroke-width: 1.5; }
      .zt { font-size: 19px; font-weight: bold; fill: #222; }
      .box { fill: #fff; stroke: #333; stroke-width: 1.6; }
      .bt { font-size: 18px; font-weight: bold; fill: #111; text-anchor: middle; }
      .bs { font-size: 15px; fill: #333; text-anchor: middle; }
      .li { font-size: 15.5px; fill: #222; }
      .lbl { font-size: 14.5px; fill: #222; }
      .lblb { font-size: 14.5px; font-weight: bold; fill: #111; }
      .data { stroke: #1f5fa8; stroke-width: 2.6; fill: none; }
      .cmd { stroke: #c4581b; stroke-width: 2.6; fill: none; stroke-dasharray: 9 6; }
      .io { stroke: #555; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1100" height="640" fill="#fff"/>

  <!-- Zones -->
  <rect class="zone" x="10" y="10" width="360" height="620" rx="10" fill="#eef4fb" stroke="#9db8d9"/>
  <text class="zt" x="26" y="40">Edge: NodeMCU ESP8266</text>
  <rect class="zone" x="380" y="10" width="210" height="620" rx="10" fill="#f6f6f6" stroke="#c8c8c8"/>
  <text class="zt" x="396" y="40">Wi-Fi LAN</text>
  <rect class="zone" x="600" y="10" width="490" height="620" rx="10" fill="#f0f7ec" stroke="#a9cf9a"/>
  <text class="zt" x="616" y="40">Server: Docker Compose</text>

  <!-- Edge device -->
  <rect class="box" x="30" y="66" width="150" height="66" rx="6"/>
  <text class="bt" x="105" y="94">DHT11</text>
  <text class="bs" x="105" y="117">temp + humidity</text>

  <rect class="box" x="30" y="185" width="320" height="261" rx="6"/>
  <text class="bt" x="190" y="214">Firmware loop (C++)</text>
  <text class="li" x="48" y="246">• Read sensor every 2 s</text>
  <text class="li" x="48" y="272">• Drop failed reads (sensor error)</text>
  <text class="li" x="48" y="298">• Heat index, min/max since boot</text>
  <text class="li" x="48" y="324">• Alert if T ≥ threshold (30 °C)</text>
  <text class="li" x="48" y="350">• 20-min history (120 × 10 s)</text>
  <text class="li" x="48" y="376">• Web server + MQTT client</text>
  <text class="li" x="48" y="402">• MQTT retry back-off 5–60 s</text>
  <text class="li" x="48" y="428">• LCD countdown from forecast</text>

  <rect class="box" x="30" y="500" width="150" height="60" rx="6"/>
  <text class="bt" x="105" y="526">16×2 LCD</text>
  <text class="bs" x="105" y="547">I²C backpack</text>
  <rect class="box" x="200" y="500" width="150" height="60" rx="6"/>
  <text class="bt" x="275" y="526">Buzzer</text>
  <text class="bs" x="275" y="547">2 kHz tone</text>

  <line class="io" x1="105" y1="132" x2="105" y2="183" marker-end="url(#aGray)"/>
  <text class="lbl" x="114" y="163">GPIO D5</text>
  <line class="io" x1="105" y1="446" x2="105" y2="498" marker-end="url(#aGray)"/>
  <text class="lbl" x="114" y="478">I²C D1/D2</text>
  <line class="io" x1="275" y1="446" x2="275" y2="498" marker-end="url(#aGray)"/>
  <text class="lbl" x="284" y="478">GPIO D6</text>

  <!-- Legend -->
  <line class="data" x1="30" y1="598" x2="62" y2="598"/>
  <text class="lbl" x="68" y="603">data</text>
  <line class="cmd" x1="118" y1="598" x2="150" y2="598"/>
  <text class="lbl" x="156" y="603">commands</text>
  <line class="io" x1="246" y1="598" x2="278" y2="598"/>
  <text class="lbl" x="284" y="603">local I/O</text>

  <!-- MQTT between board and broker -->
  <text class="lblb" x="396" y="176">MQTT publish</text>
  <text class="lbl" x="396" y="196">telemetry JSON, 2 s</text>
  <text class="lbl" x="396" y="216">status + Last Will</text>
  <line class="data" x1="350" y1="232" x2="618" y2="232" marker-end="url(#aBlue)"/>
  <line class="cmd" x1="620" y1="298" x2="352" y2="298" marker-end="url(#aOrange)"/>
  <text class="lblb" x="396" y="322">MQTT subscribe</text>
  <text class="lbl" x="396" y="342">cmd/threshold, mute</text>
  <text class="lbl" x="396" y="362">forecast</text>

  <!-- HTTP between board and browser -->
  <path class="data" d="M350,392 H558 V468" marker-start="url(#aBlue)" marker-end="url(#aBlue)"/>
  <text class="lblb" x="396" y="414">HTTP + JSON</text>
  <text class="lbl" x="396" y="434">status 2 s</text>
  <text class="lbl" x="396" y="454">history 10 s</text>
  <rect class="box" x="395" y="470" width="180" height="96" rx="6"/>
  <text class="bt" x="485" y="498">Browser</text>
  <text class="bs" x="485" y="520">web dashboard</text>
  <text class="bs" x="485" y="541">threshold, mute</text>

  <!-- Server -->
  <rect class="box" x="395" y="62" width="180" height="72" rx="6"/>
  <text class="bt" x="485" y="91">MQTT client</text>
  <text class="bs" x="485" y="114">remote commands</text>
  <path class="cmd" d="M575,98 H690 V178" marker-end="url(#aOrange)"/>

  <rect class="box" x="880" y="62" width="190" height="80" rx="6"/>
  <text class="bt" x="975" y="91">Forecaster</text>
  <text class="bs" x="975" y="114">trend fit, 10 min ahead</text>
  <text class="bs" x="975" y="134">self-scoring (MAE)</text>
  <path class="data" d="M750,180 V86 H878" marker-end="url(#aBlue)"/>
  <text class="lbl" x="758" y="78">telemetry</text>
  <path class="data" d="M880,124 H785 V178" marker-end="url(#aBlue)"/>
  <text class="lbl" x="800" y="160">forecast</text>

  <rect class="box" x="620" y="180" width="190" height="140" rx="6"/>
  <text class="bt" x="715" y="225">Mosquitto</text>
  <text class="bs" x="715" y="250">MQTT broker</text>
  <text class="bs" x="715" y="272">port 1883</text>

  <rect class="box" x="880" y="180" width="190" height="140" rx="6"/>
  <text class="bt" x="975" y="225">Telegraf</text>
  <text class="bs" x="975" y="250">MQTT consumer</text>
  <text class="bs" x="975" y="272">topic → device tag</text>
  <line class="data" x1="810" y1="250" x2="878" y2="250" marker-end="url(#aBlue)"/>

  <rect class="box" x="880" y="400" width="190" height="120" rx="6"/>
  <text class="bt" x="975" y="440">InfluxDB 2</text>
  <text class="bs" x="975" y="465">time-series DB</text>
  <text class="bs" x="975" y="487">30-day retention</text>
  <line class="data" x1="975" y1="320" x2="975" y2="398" marker-end="url(#aBlue)"/>
  <text class="lbl" x="984" y="364">flush 5 s</text>

  <rect class="box" x="620" y="400" width="190" height="120" rx="6"/>
  <text class="bt" x="715" y="440">Grafana</text>
  <text class="bs" x="715" y="465">Flux queries</text>
  <text class="bs" x="715" y="487">refresh 5 s</text>
  <line class="data" x1="880" y1="460" x2="812" y2="460" marker-end="url(#aBlue)"/>

  <rect x="620" y="546" width="450" height="72" rx="6" fill="#fff" stroke="#a9cf9a" stroke-width="1.4"/>
  <text class="lblb" x="634" y="569">Measured (median):</text>
  <text class="lbl" x="634" y="589">MQTT hop 1.7 ms · publish → stored in DB 4.6 s</text>
  <text class="lbl" x="634" y="609">device offline flagged 0.01 s (reset), 24 s (power loss)</text>
</svg>
