[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# Sensor readings: smartroom/<device>/telemetry (JSON)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["smartroom/+/telemetry"]
  qos = 0
  data_format = "json"
  name_override = "room_climate"
  tagexclude = ["topic"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "smartroom/+/telemetry"
    tags = "_/device/_"

# Device online/offline (retained message + Last Will): smartroom/<device>/status
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["smartroom/+/status"]
  qos = 1
  data_format = "value"
  data_type = "string"
  name_override = "device_status"
  tagexclude = ["topic"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "smartroom/+/status"
    tags = "_/device/_"

# 10-minute temperature forecast from server/forecaster: smartroom/<device>/forecast (JSON)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["smartroom/+/forecast"]
  qos = 0
  data_format = "json"
  name_override = "room_forecast"
  tagexclude = ["topic"]

  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "smartroom/+/forecast"
    tags = "_/device/_"

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "smartroom"
  bucket = "smartroom"
